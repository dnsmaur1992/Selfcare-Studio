<style>
/* Layout: one native-feeling column (max 560px), grouped cards, bottom tab bar; training views swap tabs for a fixed action bar. */
:root {
  --bg: #F3F1F5;
  --surface: #FFFFFF;
  --surface2: #ECE8F0;
  --fg: #1D1A21;
  --muted: #6F6A77;

  --accent: #9C2F63;

  --ok: #2F7D57;
  --ok-soft: #E0F0E7;
  --warn: #9A5A0C;

  --calm: #3F6E8C;
  --calm-soft: #E2EDF4;
  --fig: #2A2530;
  --fig2: #A9A2B1;
  --prop: #CFC9D6;
  --band: #2F8C86;
  --glow: rgba(156, 47, 99, 0.26);

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121015; --surface: #1C1920; --surface2: #27232C; --fg: #F2EEF5; --muted: #A39DAB; --line: #2F2A35;
    --accent: #E7769F; --accent-ink: #1C0C14; --accent-soft: #3B1E2C; --ok: #63C392; --ok-soft: #173326;
    --warn: #E6A653; --warn-soft: #3A2A14; --calm: #8DBBD8; --calm-soft: #1B2B36;
    --fig: #EEE9F2; --fig2: #6C6575; --prop: #47414E; --band: #5FC2BA; --glow: rgba(231, 118, 159, 0.32);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121015; --surface: #1C1920; --surface2: #27232C; --fg: #F2EEF5; --muted: #A39DAB; --line: #2F2A35;
  --accent: #E7769F; --accent-ink: #1C0C14; --accent-soft: #3B1E2C; --ok: #63C392; --ok-soft: #173326;
  --warn: #E6A653; --warn-soft: #3A2A14; --calm: #8DBBD8; --calm-soft: #1B2B36;
  --fig: #EEE9F2; --fig2: #6C6575; --prop: #47414E; --band: #5FC2BA; --glow: rgba(231, 118, 159, 0.32);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; font-size: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

h2 { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 650; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 7px 12px; background: var(--surface2); font-size: 14px; font-weight: 550; line-height: 1.2; }
.chip.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip.tag { padding: 4px 10px; font-size: 12.5px; cursor: default; }
.chip.busy { background: var(--warn-soft); color: var(--warn); text-decoration: line-through; }
.chip.calm { background: var(--calm-soft); color: var(--calm); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 15px; padding: 0 18px; font-weight: 650; font-size: 16px; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.ghost { background: var(--surface2); color: var(--fg); }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--fg); }
.btn.sm { min-height: 40px; font-size: 14.5px; border-radius: 12px; width: auto; padding: 0 14px; }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.link { color: var(--accent); font-weight: 600; font-size: 14.5px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border-radius: 9px; padding: 8px 6px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button small { display: block; font-weight: 500; font-size: 11.5px; opacity: .8; }
.list { background: var(--surface); border-radius: 18px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); min-height: 52px; width: 100%; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .chev { color: var(--muted); font-size: 18px; }
.field { width: 100%; border: 0; background: var(--surface2); border-radius: 12px; padding: 12px 14px; outline: none; }
.field:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
.toggle { width: 51px; height: 31px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle.on { background: var(--ok); }
.toggle.on::after { transform: translateX(20px); }
/* figures */
svg.fig { display: block; width: 100%; height: auto; aspect-ratio: 164 / 120; max-width: 100%; }
svg.fig .fl { stroke: var(--line); stroke-width: 1.5; }
svg.fig .pr { fill: var(--prop); }
svg.fig .pl { stroke: var(--prop); stroke-linecap: round; fill: none; }
svg.fig .b1 { stroke: var(--fig); stroke-width: 4.6; stroke-linecap: round; fill: none; }
svg.fig .b2 { stroke: var(--fig2); stroke-width: 4.4; stroke-linecap: round; fill: none; }
svg.fig .hi { stroke: var(--accent); }
svg.fig .hi2 { stroke: var(--accent); opacity: .55; }
svg.fig .gl { stroke: var(--glow); stroke-width: 12; stroke-linecap: round; fill: none; }
svg.fig .glc { fill: var(--glow); }
svg.fig .hic { fill: var(--accent); }
svg.fig .hd { fill: var(--fig); }
svg.fig .pony { stroke: var(--fig); stroke-width: 3.2; stroke-linecap: round; fill: none; }
svg.fig .cab { stroke: var(--muted); stroke-width: 1.1; }
svg.fig .bnd { stroke: var(--band); stroke-width: 2.2; stroke-linecap: round; }
svg.fig .dbb { stroke: var(--fig); stroke-width: 2.2; stroke-linecap: round; }
svg.fig .dbw { fill: var(--fig); }
svg.fig .pad { fill: var(--prop); stroke: var(--fig2); stroke-width: .8; }
.figbox { background: var(--surface2); border-radius: 14px; overflow: hidden; }
.figbox:not(.s):not(.m) svg.fig { height: min(210px, 52vw); width: auto; margin: 0 auto; }
.sheet .figbox:not(.s):not(.m) svg.fig { height: min(150px, 40vw); }
.figbox.s { width: 72px; flex: none; border-radius: 11px; }
.figbox.m { width: 108px; flex: none; }
/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button.on { color: var(--accent); }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }
.actionbar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
/* week */
.week { display: flex; flex-direction: column; }
.wd { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 56px; }
.wd:last-child { border-bottom: 0; }
.wd.today { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.wd .dn { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1; }
.wd .dd { font-size: 11.5px; color: var(--muted); }
.wd .units { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.unit { border-radius: 10px; padding: 6px 10px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); max-width: 100%; text-align: left; }
.unit.kraft { background: var(--accent-soft); color: var(--accent); }
.unit.pilates, .unit.mobility { background: var(--calm-soft); color: var(--calm); }
.unit.mini { background: var(--warn-soft); color: var(--warn); }
.unit.done { opacity: .62; }
.unit .ck { font-size: 12px; }
.plus { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); color: var(--muted); font-size: 20px; line-height: 1; display: grid; place-items: center; }
/* hero */
.hero { gap: 14px; }
.hero .big { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
/* plan rows */
.pi { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pi:last-child { border-bottom: 0; }
.note { font-size: 12.5px; color: var(--accent); font-weight: 600; }
.note.ok { color: var(--ok); }
/* sets */
.sets { display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; align-items: center; }
.sets .h { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.sets .n { font-family: var(--display); font-weight: 700; color: var(--muted); text-align: center; }
.sets input { width: 100%; border: 0; background: var(--surface2); border-radius: 11px; padding: 11px 10px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 0; }
.sets input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
.sets .bw { grid-column: span 1; text-align: center; font-size: 12.5px; color: var(--muted); }
.ckb { width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; color: var(--muted); }
.ckb.on { background: var(--ok); color: #fff; }
.ckb svg { width: 22px; height: 22px; }
.sets .rowdone input { opacity: .7; }
/* rest timer */
.rest { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 21; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.rest .in { max-width: 560px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); position: relative; overflow: hidden; }
.rest .t { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.rest .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.rest button { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; }
.rest.end .in { background: var(--ok); color: #fff; }
/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 8, 14, .42); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); }
/* onboarding */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps i { height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.opt { text-align: left; background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: inset 0 0 0 1.5px transparent; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.opt.on { box-shadow: inset 0 0 0 2px var(--accent); }
.opt b { font-weight: 650; }
.wdchips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.wdchips .chip { padding: 8px 0; text-align: center; font-size: 13px; }
.daycard { gap: 10px; }
/* stats */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px; }
.tile b { display: block; font-family: var(--display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 12px; color: var(--muted); }
/* flow player */
.flow { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.ringwrap { position: relative; width: 168px; height: 168px; margin: 0 auto; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ringwrap .rt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ringwrap .rt b { font-family: var(--display); font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.ring-bg { stroke: var(--surface2); }
.ring-fg { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
.ring-fg.calm { stroke: var(--calm); }
.hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .chip { flex: none; }
.chart { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .ln { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent-soft); }
.chart .dt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.tipl { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
details.hist summary { list-style: none; cursor: pointer; }
details.hist summary::-webkit-details-marker { display: none; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .toggle::after, .toggle { transition: none; } }
</style>

function chart(pts, unit) {

  const vs = pts.map((p) => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  const x = (i) => pl + (pts.length === 1 ? (W - pl - pr) / 2 : (i * (W - pl - pr)) / (pts.length - 1));
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const area = line + ` L${x(pts.length - 1).toFixed(1)} ${H - pb} L${x(0).toFixed(1)} ${H - pb} Z`;
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">
    ${ticks.map((t) => `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${pl - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${fmt(t, 1)}</text>`).join("")}

    ${unit ? `<text x="4" y="${pt}">${unit}</text>` : ""}
  </svg>`;
}

function renderSheet() {
  const el = document.getElementById("sheet");

}
function openSheet(fn) { U.sheet = fn; renderSheet(); }
function closeSheet() { U.sheet = null; renderSheet(); }
function go(v) { U.view = v; if (v !== "train") U.rest = U.rest && v === "home" ? U.rest : null; closeSheet(); render(); window.scrollTo(0, 0); }
let toastT = null;
function toast(msg) {
  let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2600);
}

/* ---------------- Audio & Wake Lock ---------------- */
let actx = null;
function beep(f) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f || 880; g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.4); } catch (e) {}
}
let wl = null;
async function wakeLock() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch (e) {} }

/* ---------------- Backup ---------------- */
let DL = null;
(async () => { try { if (window.claude && window.claude.use) DL = await window.claude.use("downloads"); } catch (e) {} })();
const backupText = () => JSON.stringify({ app: "satzwerk", v: 1, exported: new Date().toISOString(), data: S });
async function backupSave() {
  const data = backupText(); const fn = `selfcare-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
  if (DL) {
    try { await DL.save({ filename: fn, data }); toast("Backup gespeichert"); } catch (e) { if (e && e.code === "declined") return; openSheet(() => copySheet(data)); }
    return;
  }
  try {
    const file = new File([data], fn, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Selfcare Studio Backup" }); toast("Backup gespeichert"); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = fn; document.body.appendChild(a); a.click(); a.remove(); toast("Backup erstellt"); } catch (e) { openSheet(() => copySheet(data)); }
}
let pendingImport = null;
document.getElementById("imp").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  f.text().then((t) => {
    let o; try { o = JSON.parse(t); } catch (err) { toast("Die Datei ist kein gültiges Backup."); return; }
    if (!o || o.app !== "satzwerk" || !o.data || !Array.isArray(o.data.sessions)) { toast("Die Datei ist kein Selfcare-Studio-Backup."); return; }
    pendingImport = o;
    const d = new Date(o.exported);
    openSheet(() => confirmSheet("Backup laden?", `Backup vom ${d.toLocaleDateString("de-DE")} mit ${o.data.sessions.length} Einheiten. Es ersetzt alle Daten auf diesem Gerät.`, "import2", "Backup laden"));
  });
});

/* ---------------- Events ---------------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a; const d = t.dataset;
  if (a === "scrim") { if (e.target === t) closeSheet(); return; }
  if (actx === null && (a === "setdone" || a === "fl-start" || a === "go-train")) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  switch (a) {
    case "tab": go(d.v); break;
    case "resume": go(S.active.flow ? "flow" : "train"); break;
    case "start": closeSheet(); startSetup(d.s); break;
    case "start-mini": closeSheet(); startSetup(d.s, "mini"); break;
    case "slot": openSheet(() => slotSheet(d.s)); break;
    case "add-slot": openSheet(() => addSheet(+d.wd)); break;
    case "addtype": thisWeek().slots.push({ id: uid(), type: d.t, wd: +d.wd }); save(); closeSheet(); render(); toast(`${TYPES[d.t].n} am ${WDL[d.wd]} eingeplant`); break;
    case "addkraft": thisWeek().slots.push({ id: uid(), type: "kraft", dayId: d.d, wd: +d.wd }); save(); closeSheet(); render(); break;
    case "move": { const s = thisWeek().slots.find((x) => x.id === d.s); s.wd = +d.w; save(); closeSheet(); render(); toast(+d.w ? `Auf ${WDL[d.w]} verschoben` : "Ohne festen Tag"); break; }
    case "slotrem": { const w = thisWeek(); w.slots = w.slots.filter((x) => x.id !== d.s); save(); closeSheet(); render(); break; }
    case "less": openSheet(lessSheet); break;
    case "lesspick": {
      const w = thisWeek(); const open = w.slots.filter((s) => s.type === "kraft" && !slotDone(s)).sort((x, y) => (x.wd || 9) - (y.wd || 9)); const p = +d.p;
      const chunks = Array.from({ length: p }, () => []); open.forEach((s, i) => chunks[Math.floor((i * p) / open.length)].push(s));
      const fresh = chunks.map((c, k) => { const gs = []; c.forEach((s) => slotInfo(s).groups.forEach((g) => !gs.includes(g) && gs.push(g))); return { id: uid(), type: "kraft", name: p === 1 ? "Ganzkörper kompakt" : "Kombi " + (k + 1), groups: gs, factor: p === 1 ? 0.6 : 0.8, wd: c[0].wd }; });
      w.slots = w.slots.filter((s) => !open.includes(s)).concat(fresh); save(); closeSheet(); render(); toast("Woche angepasst"); break;
    }
    case "mode": U.setup.mode = d.m; render(); break;
    case "busy": { const b = U.setup.busy; const i = b.indexOf(d.e); i >= 0 ? b.splice(i, 1) : b.push(d.e); render(); break; }
    case "go-train": startTrain(); break;
    case "setdone": {
      const it = S.active.items[+d.i]; const s = it.log[+d.j]; s.done = !s.done;
      if (s.done && !s.r) s.r = String(it.reps[0]);
      save();
      if (s.done) { const rest = restFor(EXM[it.ex]); U.rest = { end: Date.now() + rest * 1000, total: rest, beeped: false }; }
      render(); break;
    }
    case "addset": { const it = S.active.items[+d.i]; const l = it.log[it.log.length - 1]; it.log.push({ w: l ? l.w : "", r: "", done: false }); save(); render(); break; }
    case "remset": { const it = S.active.items[+d.i]; if (it.log.length > 1) it.log.pop(); save(); render(); break; }
    case "swap": openSheet(() => swapSheet(+d.i)); break;
    case "swappick": doSwap(+d.i, d.x, true); break;
    case "isfree": S.active.items[+d.i].confirmed = true; save(); render(); break;
    case "occupied": autoSwap(+d.i); break;
    case "backideal": { const A = S.active; const it = A.items[+d.i]; const id = EXM[it.ideal]; id.eq.forEach((e) => { if (A.busyAt) delete A.busyAt[e]; }); doSwap(+d.i, id.id, true); break; }
    case "restplus": if (U.rest) { U.rest.end = Math.max(U.rest.end, Date.now()) + 15000; U.rest.total += 15; U.rest.beeped = false; updRest(); } break;
    case "restskip": U.rest = null; document.getElementById("rest")?.remove(); break;
    case "finish": {
      const n = S.active.items.reduce((a, it) => a + it.log.filter((s) => s.done).length, 0);
      if (!n) openSheet(() => confirmSheet("Noch kein Satz erledigt", "Hake die Sätze ab, die du gemacht hast. Oder verwirf die Einheit.", "discard2", "Einheit verwerfen"));
      else openSheet(() => confirmSheet("Einheit beenden?", `${n} erledigte Sätze werden gespeichert. Nicht abgehakte Sätze fallen weg.`, "finish2", "Speichern & beenden"));
      break;
    }
    case "finish2": closeSheet(); finishSession(); break;
    case "discard": openSheet(() => confirmSheet("Einheit verwerfen?", "Nichts von heute wird gespeichert.", "discard2", "Verwerfen")); break;
    case "discard2": S.active = null; U.rest = null; save(); go("home"); break;
    case "info": openSheet(() => infoSheet(d.x, d.g)); break;
    case "libf": U.lib = d.f; render(); break;
    case "histt": U.hist = d.t; render(); break;
    case "delsess": e.preventDefault(); openSheet(() => confirmSheet("Einheit löschen?", "Sie verschwindet aus dem Verlauf und den Fortschritten.", "delsess2", "Löschen", `data-id="${d.id}"`)); break;
    case "delsess2": S.sessions = S.sessions.filter((s) => s.id !== d.id); save(); closeSheet(); render(); break;
    case "reps": S.reps = d.k; save(); render(); break;
    case "back": S.backCare = !S.backCare; save(); render(); break;
    case "rest": S[d.k] = +d.v; save(); render(); break;
    case "eq": S.equip[d.e] = !S.equip[d.e]; save(); render(); break;
    case "daywd": S.days[+d.i].wd = +d.w; save(); render(); break;
    case "dayg": { const gs = S.days[+d.i].groups; const k = gs.indexOf(d.g); k >= 0 ? gs.splice(k, 1) : gs.push(d.g); gs.sort((x, y) => GORDER.indexOf(x) - GORDER.indexOf(y)); save(); render(); break; }
    case "dayadd": S.days.push({ id: uid(), type: d.t, name: d.t === "kraft" ? "Neuer Tag" : TYPES[d.t].n, groups: d.t === "kraft" ? ["po"] : [], wd: 0 }); save(); render(); break;
    case "dayrem": S.days.splice(+d.i, 1); save(); render(); break;
    case "applyweek": {
      const w = thisWeek(); const keep = w.slots.filter(slotDone);
      const doneDays = new Set(keep.map((s) => s.dayId));
      w.slots = keep.concat(S.days.filter((x) => !doneDays.has(x.id)).map((x) => ({ id: uid(), type: x.type || "kraft", dayId: x.id, wd: x.wd || 0 })));
      save(); toast("Diese Woche neu geplant"); break;
    }
    case "obcount": {
      const n = +d.n; const extra = S.days.filter((x) => (x.type || "kraft") !== "kraft");
      S.days = tmplDays(n).concat(extra); save(); render(); break;
    }
    case "obnext": {
      if (U.ob === 2) {
        const bad = S.days.find((x) => (x.type || "kraft") === "kraft" && !x.groups.length);
        if (bad) { toast("Wähle für jeden Krafttag mindestens eine Muskelgruppe."); break; }
      }
      if (U.ob === 1 && !S.days.length) S.days = tmplDays(3);
      if (U.ob < 3) { U.ob++; render(); window.scrollTo(0, 0); }
      else { S.setup = true; save(); go("home"); }
      break;
    }
    case "obback": U.ob = Math.max(0, U.ob - 1); render(); break;
    case "backup": backupSave(); break;
    case "copy": {
      const txt = backupText();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Backup in die Zwischenablage kopiert"), () => openSheet(() => copySheet(txt)));
      else openSheet(() => copySheet(txt));
      break;
    }
    case "import2": if (pendingImport) { S = Object.assign(defaults(), pendingImport.data); pendingImport = null; save(); toast("Backup geladen"); U.view = S.setup ? "home" : "ob"; closeSheet(); render(); } break;
    case "reset": openSheet(() => confirmSheet("Alle Daten löschen?", "Plan, Verlauf und Einstellungen werden auf diesem Gerät gelöscht. Das lässt sich nicht rückgängig machen.", "reset2", "Endgültig löschen")); break;
    case "reset2": S = defaults(); save(); U.ob = 0; U.view = "ob"; closeSheet(); render(); break;
    case "sheetclose": closeSheet(); render(); break;
    case "daymode": {
      const day = S.days[+d.i];
      if (d.m === "custom" && !(day.custom && day.custom.length)) day.custom = buildPlan(day.groups.length ? day.groups : ["po"], 1, []).filter((it) => it.ex).map((it) => ({ ex: it.ex, g: it.g, sets: it.sets, reps: [...it.reps] }));
      day.mode = d.m; syncGroups(day); save(); render(); break;
    }
    case "cadd": U.pick = { i: +d.i, f: "all" }; openSheet(pickSheet); break;
    case "pickf": U.pick.f = d.f; renderSheet(); break;
    case "pickadd": { const day = S.days[U.pick.i]; const x = EXM[d.x]; day.custom = day.custom || []; day.custom.push({ ex: x.id, g: d.g, sets: 3, reps: baseReps(x) }); syncGroups(day); save(); renderSheet(); toast(x.n + " hinzugefügt"); break; }
    case "cdel": { const day = S.days[+d.i]; day.custom.splice(+d.j, 1); syncGroups(day); save(); render(); break; }
    case "cset": { const c = S.days[+d.i].custom[+d.j]; c.sets = Math.max(1, Math.min(8, c.sets + +d.v)); save(); render(); break; }
    case "cmove": { const L = S.days[+d.i].custom; const j = +d.j, k = j + +d.v; [L[j], L[k]] = [L[k], L[j]]; save(); render(); break; }
    case "fl-start": flowGoto(S.active.i, "prep"); wakeLock(); break;
    case "fl-pause": { const A = S.active; if (A.paused) { A.end = Date.now() + A.paused; A.paused = 0; } else { A.paused = Math.max(0, A.end - Date.now()); } save(); render(); break; }
    case "fl-next": { const A = S.active; if (A.i + 1 < A.blocks.length) flowGoto(A.i + 1, "prep"); else finishFlow(true); break; }
    case "fl-prev": flowGoto(Math.max(0, S.active.i - 1), "prep"); break;
    case "fl-end": openSheet(() => confirmSheet("Einheit beenden?", "Alles bis hierher wird gespeichert.", "fl-end2", "Beenden & speichern")); break;
    case "fl-end2": closeSheet(); finishFlow(false); break;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target; const k = t.dataset.in; if (!k) return;
  if (k === "name") { S.name = t.value.trim(); save(); }
  if (k === "dayname") { S.days[+t.dataset.i].name = t.value; save(); }
  if (k === "clo" || k === "chi") { const c = S.days[+t.dataset.i].custom[+t.dataset.j]; const v = parseInt(t.value, 10); if (v > 0) { c.reps[k === "clo" ? 0 : 1] = v; if (c.reps[0] > c.reps[1]) c.reps = [c.reps[1], c.reps[0]]; save(); } }
  if (k === "w" || k === "r") { const s = S.active.items[+t.dataset.i].log[+t.dataset.j]; s[k] = t.value.replace(/[^\d.,]/g, ""); save(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && U.sheet) closeSheet(); });

function updRest() {
  if (!U.rest || U.view !== "train") return;
  const left = Math.max(0, Math.ceil((U.rest.end - Date.now()) / 1000));
  const el = document.getElementById("rest");
  if (!el) { document.getElementById("app").insertAdjacentHTML("beforeend", restBar()); return; }
  if (left === 0 && !U.rest.beeped) { U.rest.beeped = true; beep(880); setTimeout(() => beep(1175), 220); el.outerHTML = restBar(); return; }
  const t = document.getElementById("rest-t"); const b = document.getElementById("rest-b");
  if (t && left > 0) t.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  if (b) b.style.width = Math.min(100, (1 - left / U.rest.total) * 100) + "%";
}
setInterval(() => {
  updRest(); flowTick();
  const el = document.getElementById("elapsed"); if (el && S.active) el.textContent = Math.floor((Date.now() - S.active.start) / 60000) + " Min";
}, 250);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.active) wakeLock(); });

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
