<style>
/* Layout: eine Spalte wie eine native App (max. 560px), weiche Karten, Tab-Leiste unten; im Training eine feste Aktionsleiste.
   Stil: Modemagazin trifft Gym. Pastellflächen, ein kräftiges Pink als Akzent, Didone-Schrift für Überschriften. */
:root {
  --bg: #F8F2F6;
  --surface: #FFFFFF;
  --surface2: #F3EAF2;
  --fg: #241A2A;
  --muted: #7A6B80;
  --line: #ECE0EB;
  --accent: #E0306E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDE3ED;
  --lav: #E3D8FA; --lav-ink: #5B3FB0;
  --peach: #FFE0D3; --peach-ink: #A9452A;
  --mint: #D2F1E5; --mint-ink: #1F6E55;
  --butter: #FFF0BF; --butter-ink: #7E5C00;
  --ok: #1F6E55; --ok-soft: #D2F1E5;
  --warn: #A9452A; --warn-soft: #FFE0D3;
  --calm: #5B3FB0; --calm-soft: #E3D8FA;
  --fig: #2A1F30; --prop: #E2D4E1; --band: #1FA08A; --glow: rgba(224, 48, 110, 0.26);
  --figbg: linear-gradient(165deg, #F1E9FC 0%, #FDEDF3 55%, #FFEDE3 100%);
  --top: #B79CF0; --legs: #6E4FCB; --shoe: #E0306E;
  --display: "Bodoni Moda", "Bodoni 72", Didot, "Didot LT STD", Georgia, serif;
  --body: "Outfit", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160F1A; --surface: #221828; --surface2: #2E2335; --fg: #F8EEF5; --muted: #B4A4B9; --line: #3A2D41;
    --accent: #FF5C93; --accent-ink: #2A0716; --accent-soft: #4A1A2E;
    --lav: #3A2E5C; --lav-ink: #CDBBFF; --peach: #4D2C25; --peach-ink: #FFBCA3; --mint: #1D3D33; --mint-ink: #91E2C4; --butter: #45391A; --butter-ink: #FFE08A;
    --ok: #91E2C4; --ok-soft: #1D3D33; --warn: #FFBCA3; --warn-soft: #4D2C25; --calm: #CDBBFF; --calm-soft: #3A2E5C;
    --fig: #F6E9F1; --prop: #4E3F56; --band: #5FD0BC; --glow: rgba(255, 92, 147, 0.34);
    --figbg: linear-gradient(165deg, #30244A 0%, #3A2536 60%, #3E2A2A 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160F1A; --surface: #221828; --surface2: #2E2335; --fg: #F8EEF5; --muted: #B4A4B9; --line: #3A2D41;
  --accent: #FF5C93; --accent-ink: #2A0716; --accent-soft: #4A1A2E;
  --lav: #3A2E5C; --lav-ink: #CDBBFF; --peach: #4D2C25; --peach-ink: #FFBCA3; --mint: #1D3D33; --mint-ink: #91E2C4; --butter: #45391A; --butter-ink: #FFE08A;
  --ok: #91E2C4; --ok-soft: #1D3D33; --warn: #FFBCA3; --warn-soft: #4D2C25; --calm: #CDBBFF; --calm-soft: #3A2E5C;
  --fig: #F6E9F1; --prop: #4E3F56; --band: #5FD0BC; --glow: rgba(255, 92, 147, 0.34);
  --figbg: linear-gradient(165deg, #30244A 0%, #3A2536 60%, #3E2A2A 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; font-size: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 600; font-size: 38px; line-height: 1.02; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
h1 em, .big em, h2 em { font-style: italic; color: var(--accent); font-weight: 500; }
h2 { font-family: var(--display); font-weight: 600; font-size: 23px; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-size: 15.5px; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: 24px; box-shadow: 0 1px 0 rgba(36, 26, 42, 0.03), 0 10px 30px -18px rgba(120, 40, 90, 0.18); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 8px 14px; background: var(--surface2); font-size: 14px; font-weight: 500; line-height: 1.2; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip.tag.on { background: var(--accent-soft); color: var(--accent); }
.chip.g { background: var(--lav); color: var(--lav-ink); }
.chip.tag { padding: 4px 10px; font-size: 12.5px; cursor: default; }
.chip.busy { background: var(--warn-soft); color: var(--warn); text-decoration: line-through; }
.chip.calm { background: var(--calm-soft); color: var(--calm); }
.chip.okc { background: var(--ok-soft); color: var(--ok); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 999px; padding: 0 18px; font-weight: 600; letter-spacing: .01em; font-size: 16px; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.ghost { background: var(--surface2); color: var(--fg); }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--fg); }
.btn.sm { min-height: 42px; font-size: 14.5px; border-radius: 999px; width: auto; padding: 0 14px; }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.link { color: var(--accent); font-weight: 600; font-size: 14.5px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border-radius: 9px; padding: 8px 6px; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.seg button { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 350px) { .seg button { font-size: 12.5px; padding: 8px 3px; } .seg button small { font-size: 10.5px; } }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button small { display: block; font-weight: 500; font-size: 11.5px; opacity: .8; }
.list { background: var(--surface); border-radius: 24px; box-shadow: 0 10px 30px -20px rgba(120, 40, 90, 0.18); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); min-height: 52px; width: 100%; text-align: left; }
.li:last-child { border-bottom: 0; }
.li .chev { color: var(--muted); font-size: 18px; }
.field { width: 100%; border: 0; background: var(--surface2); border-radius: 12px; padding: 12px 14px; outline: none; }
.field:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
.toggle { width: 51px; height: 31px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle.on { background: var(--ok); }
.toggle.on::after { transform: translateX(20px); }
/* figures */
svg.fig { display: block; width: 100%; height: auto; aspect-ratio: 164 / 120; max-width: 100%; }
svg.fig .fl { stroke: var(--line); stroke-width: 1.5; }
svg.fig .pr { fill: var(--prop); }
svg.fig .pl { stroke: var(--prop); stroke-linecap: round; fill: none; }
svg.fig .b1, svg.fig .b2 { stroke: var(--fig); stroke-width: 4.6; stroke-linecap: round; fill: none; }
svg.fig .top { stroke: var(--top); stroke-width: 5.6; }
svg.fig .legs { stroke: var(--legs); stroke-width: 5; }
svg.fig .shoe { stroke: var(--shoe); stroke-width: 5.2; }
svg.fig .bk { opacity: .5; }
svg.fig .hi { stroke: var(--accent); }
svg.fig .hi2 { stroke: var(--accent); opacity: .55; }
svg.fig .gl { stroke: var(--glow); stroke-width: 12; stroke-linecap: round; fill: none; }
svg.fig .glc { fill: var(--glow); }
svg.fig .hic { fill: var(--accent); }
svg.fig .hd { fill: var(--fig); }
svg.fig .hr { fill: var(--hair, var(--fig)); }
svg.fig .hcap { fill: var(--shoe); }
svg.fig .hcapb { stroke: var(--shoe); stroke-width: 2.4; stroke-linecap: round; fill: none; }
svg.fig .pony { stroke: var(--hair, var(--fig)); stroke-width: 3.2; stroke-linecap: round; fill: none; }
svg.fig .cab { stroke: var(--muted); stroke-width: 1.1; }
svg.fig .bnd { stroke: var(--band); stroke-width: 2.2; stroke-linecap: round; }
svg.fig .dbb { stroke: var(--fig); stroke-width: 2.2; stroke-linecap: round; }
svg.fig .dbw { fill: var(--fig); }
svg.fig .pad { fill: var(--prop); stroke: var(--muted); stroke-width: .8; }
.figbox { background: var(--figbg); border-radius: 20px; overflow: hidden; }
.figbox:not(.s):not(.m):not(.sw) svg.fig { height: min(210px, 52vw); width: auto; margin: 0 auto; }
.sheet .figbox:not(.s):not(.m):not(.sw) svg.fig { height: min(150px, 40vw); }
.figbox.s { width: 72px; flex: none; border-radius: 16px; }
.figbox.m { width: 108px; flex: none; }
.outfits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.outfit { display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.outfit .figbox svg.fig { position: absolute; width: 160%; max-width: none; left: -30%; top: -14%; }
.outfit .figbox { position: relative; width: 100%; height: 118px; border-radius: 16px; box-shadow: inset 0 0 0 2px transparent; }
.outfit.on .figbox { box-shadow: inset 0 0 0 2.5px var(--accent); }
.outfit.on { color: var(--fg); font-weight: 600; }
/* Training im Vollbild */
.tr { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 130px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.tr-top { display: flex; align-items: center; gap: 12px; }
.tr-x { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-size: 18px; flex: none; color: var(--muted); }
.tr-prog { display: grid; gap: 3px; }
.tr-prog i { height: 5px; border-radius: 3px; background: var(--line); }
.tr-prog i.warm { background: color-mix(in srgb, var(--butter-ink) 22%, var(--line)); }
.tr-prog i.cool { background: color-mix(in srgb, var(--lav-ink) 20%, var(--line)); }
.tr-prog i.d { background: var(--accent); opacity: .45; }
.tr-prog i.c { background: var(--accent); }
.tr-prog i.s { background: repeating-linear-gradient(90deg, var(--muted) 0 2px, transparent 2px 4px); opacity: .5; }
.tr-body { display: flex; flex-direction: column; gap: 14px; }
.tr-name { font-size: 32px; text-align: center; }
.figbox.tr-fig svg.fig { height: min(220px, 34vh) !important; }
.presc { font-size: 18px; font-weight: 600; color: var(--fg); }
.ask { gap: 12px; text-align: center; align-items: stretch; }
.actionbar .btn { white-space: nowrap; }
.btn.big { min-height: 62px; font-size: 18px; }
.btn.big svg { width: 24px; height: 24px; }
.btn.warnb { background: var(--peach); color: var(--peach-ink); }
.setc { gap: 12px; }
.stp { display: grid; grid-template-columns: 62px 46px minmax(0, 1fr) 46px 36px; gap: 6px; align-items: center; }
.stp .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.stp .u { font-size: 12.5px; color: var(--muted); }
.stp input { min-width: 0; width: 100%; border: 0; background: var(--surface2); border-radius: 16px; padding: 12px 2px; text-align: center; font-size: 24px; font-weight: 700; font-family: var(--body); }
.stp input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.pm { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 26px; font-weight: 600; display: grid; place-items: center; }
.cardio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cardio .opt { align-items: center; text-align: center; gap: 8px; }
.cardio .figbox.s { width: 100%; }
.ringwrap { width: min(200px, 52vw); height: min(200px, 52vw); }
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.swatches input[type="color"] { width: 40px; height: 34px; border: 0; padding: 0; background: none; border-radius: 10px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 11.5px; line-height: 1.2; color: var(--muted); padding: 10px 6px; border-radius: 16px; background: var(--surface2); opacity: .5; }
.badge svg { width: 30px; height: 30px; }
.badge.on { opacity: 1; background: var(--butter); color: var(--butter-ink); font-weight: 600; }
.badge.pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.badge.pop { position: relative; overflow: hidden; }
.badge.pop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); transform: translateX(-120%); animation: shimmer 1.6s .7s ease-in-out 2; }
@keyframes shimmer { to { transform: translateX(120%); } }
.donecheck { position: relative; width: 74px; height: 74px; }
.donecheck svg { width: 100%; height: 100%; }
.donecheck circle { fill: var(--accent); transform-origin: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.donecheck path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s .35s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.spark { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--c); opacity: 0; animation: spark .9s .45s ease-out forwards; }
@keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.3); } }
.weekring { display: flex; align-items: center; gap: 14px; }
.weekring svg { width: 64px; height: 64px; flex: none; transform: rotate(-90deg); }
.weekring .bg { stroke: var(--surface2); } .weekring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s ease-out .3s; }
.card.gold { background: linear-gradient(135deg, #FFE7A3, #FFC9A8 60%, #FFB3CF); color: #5A3B00; }
.card.gold .eyebrow, .card.gold .muted { color: #6E4A00; }
.card.gold .weekring .fg { stroke: #C77700; } .card.gold .weekring .bg { stroke: rgba(255,255,255,.55); }
@media (prefers-reduced-motion: reduce) { .badge.pop::after, .spark { display: none; } .donecheck circle, .donecheck path { animation: none; stroke-dashoffset: 0; } .weekring .fg { transition: none; } }
.pr { background: var(--accent-soft); }
.heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; }
.hm { display: block; aspect-ratio: 1; border-radius: 4px; background: var(--surface2); }
.hm.k { background: var(--accent); }
.hm.f { background: var(--lav-ink); opacity: .7; }
.hm.fut { opacity: .35; }
.hm.lg { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
a.tr-x { text-decoration: none; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .badge.pop { animation: none; } }
.flashfx { position: fixed; inset: 0; z-index: 70; pointer-events: none; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%); animation: flashfx .6s ease-out forwards; }
@keyframes flashfx { from { opacity: 1; } to { opacity: 0; } }
.ringwrap.hot { animation: hot 1s ease-in-out infinite; }
.ringwrap.hot .ring-fg { stroke: var(--warn); }
@keyframes hot { 50% { transform: scale(1.04); } }
.updbar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 80; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.updbar button { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 12px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .ringwrap.hot { animation: none; } }
.unit.skip { opacity: .5; text-decoration: line-through; }
.toastbtn { margin-left: 10px; color: var(--accent); font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 96px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
.bar .bl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .bt { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.bar .rng { position: absolute; top: 0; bottom: 0; background: var(--mint); }
.bar .val { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 4px; background: var(--fig); opacity: .35; }
.bar .val.ok { background: var(--ok); opacity: 1; }
.bar .val.over { background: var(--warn); opacity: 1; }
.bar .bv { text-align: right; font-weight: 600; }
.rpe { display: flex; flex-wrap: wrap; gap: 8px; }

  const t = (v, n, ic) => `<button data-a="tab" data-v="${v}" class="${U.view === v ? "on" : ""}" aria-label="${n}">${IC[ic]}${n}</button>`;
  return `<nav class="tabs"><div class="in">${t("home", "Woche", "today")}${t("lib", "Übungen", "lib")}${t("hist", "Verlauf", "hist")}${t("prof", "Profil", "prof")}</div></nav>`;
}
const chipG = (g) => `<span class="chip tag g">${esc(GROUPS[g]?.n || g)}</span>`;
const typeChip = (type) => `<span class="chip tag ${type === "kraft" ? "on" : type === "mini" ? "busy" : "calm"}" style="${type === "mini" ? "text-decoration:none" : ""}">${TYPES[type].n}</span>`;

/* --- Einheit vorbereiten --- */

  if (slot.type === "pilates" || slot.type === "mobility") return startFlow(slot);
  U.setup = { slotId, mode: slot.type === "mini" ? "mini" : mode || "normal", busy: [] };
  go("setup");
}
function setupItems() {
  const wk = thisWeek(); const slot = wk.slots.find((s) => s.id === U.setup.slotId); const info = slotInfo(slot);
  if (U.setup.mode === "mini") return buildMini(info.groups, U.setup.day);

}

/* --- Training: geführter Ablauf im Vollbild ---
   Ein Bildschirm, ein Schritt. Schritte: Cardio (Gerät wählen + Zeit), Zeitübungen (Aufwärmen/Cool-down),
   Kraftübungen (Gerät frei? → Sätze → Pause). Position und Phase werden gespeichert. */
const CARDIO = [
  { id: "cardio_rad", eq: "rad" },
  { id: "cardio_cross", eq: "cross" },
  { id: "cardio_lauf", eq: "laufband" },
  { id: "cardio_ruder", eq: "ruderg" },
  { id: "cardio_stepper", eq: "stepper" },
  { id: "cardio_march", eq: null },
];
const LOWER = ["po", "quad", "ham", "abd", "add", "waden"], UPPER = ["ruecken", "brust", "schulter", "bi", "tri"];
FLOW.forEach((f) => { if (f.id === "band_walk" || f.id === "band_pullapart") f.eq = ["band"]; });
const ACT = {
  lower: ["m_hipcircle", "band_walk", "bridge", "m_legswing", "bwsquat"],
  upper: ["m_arms", "band_pullapart", "m_catcow", "wallslide", "m_openbook"],
  core: ["deadbug"],
};
const STRETCH = { po: "m_fig4", quad: "str_quad", ham: "m_ham", abd: "m_fig4", add: "str_butterfly", waden: "m_calf", ruecken: "m_child", brust: "str_chest", schulter: "str_shoulder", bi: "str_chest", tri: "str_tri", bauch: "p_swan" };
function blocksOf(ids, sec, sect) {
  const out = [];
  ids.forEach((id) => { const x = EXM[id]; if (!x || limited(id)) return; if (x.side) { out.push({ k: "timed", ex: id, sec, side: "links", sect }); out.push({ k: "timed", ex: id, sec, side: "rechts", sect }); } else out.push({ k: "timed", ex: id, sec, side: "", sect }); });
  return out;
}
/* Aufwärmen: 10–15 Min (Mini 8–10): Cardio, Aktivierung passend zu den Muskelgruppen, Aufwärmsätze in der ersten großen Übung. */
function buildWarm(groups, mode, day) {
  if (mode === "mini") return miniWarm(day || S.dayType);
  const lo = groups.some((g) => LOWER.includes(g)), up = groups.some((g) => UPPER.includes(g));
  /* Nur Aktivierungen, deren Geräte (z. B. Band) eingeblendet sind; Ersatz: Körpergewicht. */
  const ok = (id) => EXM[id] && inStudio(EXM[id]); const pick = (L, alt) => L.map((id) => (ok(id) ? id : alt)).filter((id, i, a) => a.indexOf(id) === i);
  const ACTX = { lower: pick(ACT.lower, "frog"), upper: pick(ACT.upper, "yraise"), core: ACT.core };
  let ids = lo && up ? [ACTX.lower[0], ACTX.upper[0], ACTX.lower[1], ACTX.upper[1], ACTX.lower[2]] : up ? ACTX.upper.slice(0, 5) : ACTX.lower.slice(0, 5);
  if (!lo && !up) ids = [ACTX.lower[0], ACTX.upper[0], ACTX.core[0], ACTX.lower[2], ACTX.upper[2]];
  const mini = mode === "mini";
  if (mini) ids = ids.slice(0, 4);
  const cardioSec = mini ? 270 : mode === "kurz" ? 300 : 360;
  return [{ k: "cardio", sec: cardioSec, sect: "warm" }, ...blocksOf(ids, 40, "warm")];
}
/* Cool-down: ca. 5 Min Dehnen der trainierten Muskeln. */
function buildCool(groups) {
  const ids = [];
  (groups.length ? groups : ["po", "ruecken"]).forEach((g) => { const id = STRETCH[g]; if (id && !ids.includes(id)) ids.push(id); });
  const out = []; let t = 0;
  for (const id of ids) { const b = blocksOf([id], 35, "cool"); if (t + b.length * 35 > 330 && out.length) break; out.push(...b); t += b.length * 35; }
  if (t < 200 && !ids.includes("m_child")) out.push(...blocksOf(["m_child"], 40, "cool"));
  return out;
}
const warmSecs = (steps) => steps.filter((s) => s.sect === "warm").reduce((a, s) => a + s.sec + (s.k === "timed" ? 10 : 0), 0);

/* Gewicht: Schrittweite, Schätzung aus ähnlichen Übungen, Nachsteuern nach jedem Satz. */
const KF = { kh: 0.42, kb: 0.42, kabel: 0.62, smith: 0.9 };

/* Pilates & Mobility: Ansage beim Bereitmachen, Signalton bei Start und Ende jeder Position, Countdown in den letzten 3 Sekunden. */
function flowGoto(i, phaseName) {
  const A = S.active; A.i = i; A.phase = phaseName; A.cd = "";
  const b = A.blocks[i]; const x = EXM[b.ex];
  A.end = Date.now() + 1000 * (phaseName === "prep" ? 10 : b.sec); A.paused = 0;
  if (phaseName === "prep") { const pb = A.blocks[i - 1]; const sw = pb && pb.ex === b.ex && b.side; say(sw ? `Seitenwechsel: ${b.side}` : `Gleich: ${x ? x.n : ""}${b.side ? ", " + b.side : ""}`); }
  if (phaseName === "work") { gong(); flash(); setTimeout(() => say(b.sec >= 60 ? `${Math.round(b.sec / 60) === 1 ? "Eine Minute" : Math.round(b.sec / 60) + " Minuten"}. Ruhig atmen.` : `${b.sec} Sekunden. Ruhig atmen.`), 1100); }
  save(); render();
}
function vFlow() {

  const calm = A.type !== "kraft";

function flowTick() {
  const A = S.active; if (!A || !A.flow || U.view !== "flow" || A.phase === "ready" || A.paused) return;
  const left = Math.max(0, (A.end - Date.now()) / 1000);

  const t = document.getElementById("fl-t"); if (t) t.textContent = Math.ceil(left);
  const r = document.getElementById("ring"); if (r) r.setAttribute("stroke-dashoffset", String(276.5 * (1 - left / dur)));
  if (left > 0 && left <= 3) { const c = Math.ceil(left); const key = c + ":" + A.i + A.phase; if (A.cd !== key) { A.cd = key; beep(1046); } }

  const left = A.paused ? A.paused / 1000 : Math.max(0, (A.end - Date.now()) / 1000); const done = Math.round(b.sec - left);
  if (done >= b.sec * 0.5) { b.secDone = done; b.skipped = false; } else b.skipped = true;
}

  const skipped = A.blocks.filter((b) => b.skipped).length;

}

function chart(pts, unit) {
  if (!pts.length) return "";
  const W = 320, H = 140, pl = 34, pr = 10, pt = 12, pb = 22;
  const vs = pts.map((p) => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  const x = (i) => pl + (pts.length === 1 ? (W - pl - pr) / 2 : (i * (W - pl - pr)) / (pts.length - 1));
  const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const area = line + ` L${x(pts.length - 1).toFixed(1)} ${H - pb} L${x(0).toFixed(1)} ${H - pb} Z`;
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">
    ${ticks.map((t) => `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${pl - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${fmt(t, 1)}</text>`).join("")}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.map((p, i) => `<circle class="dt" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join("")}
    <text x="${pl}" y="${H - 6}">${dShort(pts[0].d)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${dShort(pts[pts.length - 1].d)}</text>
    ${unit ? `<text x="4" y="${pt}">${unit}</text>` : ""}
  </svg>`;
}

function spark(vals) {

}

    case "dayg": { const gs = S.days[+d.i].groups; const k = gs.indexOf(d.g); k >= 0 ? gs.splice(k, 1) : gs.push(d.g); gs.sort((x, y) => GORDER.indexOf(x) - GORDER.indexOf(y)); save(); render(); break; }
    case "dayadd": S.days.push({ id: uid(), type: d.t, name: d.t === "kraft" ? "Neuer Tag" : TYPES[d.t].n, groups: d.t === "kraft" ? ["po"] : [], wd: 0 }); save(); render(); break;
    case "dayrem": S.days.splice(+d.i, 1); save(); render(); break;
    case "applyweek": {
      const w = thisWeek(); const keep = w.slots.filter(slotDone);
      const doneDays = new Set(keep.map((s) => s.dayId));
      w.slots = keep.concat(S.days.filter((x) => !doneDays.has(x.id)).map((x) => ({ id: uid(), type: x.type || "kraft", dayId: x.id, wd: x.wd || 0 })));
      save(); toast("Diese Woche neu geplant"); break;
    }
    case "obcount": {
      const n = +d.n; const extra = S.days.filter((x) => (x.type || "kraft") !== "kraft");
      S.days = tmplDays(n).concat(extra); save(); render(); break;
    }
    case "obnext": {
      if (U.ob === 3) {
        const bad = S.days.find((x) => (x.type || "kraft") === "kraft" && !x.groups.length);
        if (bad) { toast(bad.mode === "custom" ? "Füge jedem eigenen Tag mindestens eine Übung hinzu." : "Wähle für jeden Krafttag mindestens eine Muskelgruppe."); break; }
      }
      if (U.ob === 1 && !S.days.filter((x) => (x.type || "kraft") === "kraft").length) S.days = tmplDays(3).concat(S.days);
      if (U.ob < 4) { U.ob++; render(); window.scrollTo(0, 0); }
      else { S.setup = true; S.newsSeen = NEWS.v; save(); go("home"); if (!S.ack) { U.sheetLock = true; openSheet(ackSheet); } if (S.pendingTag) { const t = S.pendingTag; delete S.pendingTag; save(); setTimeout(() => openSheet(() => importSheet(t)), 300); } }
      break;
    }
    case "obback": U.ob = Math.max(0, U.ob - 1); render(); break;
    case "backup": backupSave(); break;
    case "copy": {
      const txt = backupText();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { toast("Backup in die Zwischenablage kopiert"); S.flags.backup = true; S.lastBackup = new Date().toISOString(); save(); }, () => openSheet(() => copySheet(txt)));
      else openSheet(() => copySheet(txt));
      break;
    }
    case "import2": if (pendingImport) { const chk = pendingImport; pendingImport = null; closeSheet(); if (applyBackup(chk)) { toast(chk.notes.length ? "Backup geladen – mit Reparaturen" : "Backup geladen"); U.view = S.setup ? (S.active ? (S.active.flow ? "flow" : "train") : "home") : "ob"; } render(); } break;
    case "reset": openSheet(() => confirmSheet("Alle Daten löschen?", "Plan, Verlauf und Einstellungen werden auf diesem Gerät gelöscht. Das lässt sich nicht rückgängig machen.", "reset2", "Endgültig löschen")); break;
    case "reset2": S = defaults(); registerCustom(); save(); U.ob = 0; U.view = "ob"; closeSheet(); render(); break;
    case "sheetclose": closeSheet(); render(); break;
    case "outfit": S.outfit = d.o; save(); render(); break;
    case "flag": S.flags[d.f] = true; save(); render(); break;
    case "flagreset": S.flags.hideStart = false; S.flags.trainTip = false; save(); toast("Einführung wird wieder angezeigt"); go("home"); break;
    case "sharelink": {
      const url = PWA.base; const txt = "Selfcare Studio – so installierst du die App: " + PWA.base + PWA.install;
      if (navigator.share) navigator.share({ title: "Selfcare Studio", text: "Selfcare Studio", url: PWA.base + PWA.install }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Link kopiert"), () => toast(url));
      break;
    }
    case "daymode": {
      const day = S.days[+d.i];
      if (d.m === "custom" && !(day.custom && day.custom.length)) day.custom = buildPlan(day.groups.length ? day.groups : ["po"], 1, []).filter((it) => it.ex).map((it) => ({ ex: it.ex, g: it.g, sets: it.sets, reps: [...it.reps] }));
      day.mode = d.m; syncGroups(day); save(); render(); break;
    }
    case "cadd": U.pick = { i: +d.i, f: "all" }; openSheet(pickSheet); break;
    case "pickf": U.pick.f = d.f; U.lastSheet = null; renderSheet(); { const sh = document.querySelector(".sheet"); if (sh) sh.style.animation = "none"; } break;
    case "pickadd": { const day = S.days[U.pick.i]; const x = EXM[d.x]; day.custom = day.custom || []; day.custom.push({ ex: x.id, g: d.g, sets: 3, reps: baseReps(x) }); syncGroups(day); save(); renderSheet(); toast(x.n + " hinzugefügt"); break; }
    case "cdel": { const day = S.days[+d.i]; day.custom.splice(+d.j, 1); syncGroups(day); save(); render(); break; }
    case "cset": { const c = S.days[+d.i].custom[+d.j]; c.sets = Math.max(1, Math.min(6, c.sets + +d.v)); save(); render(); break; }
    case "cmove": { const L = S.days[+d.i].custom; const j = +d.j, k = j + +d.v; [L[j], L[k]] = [L[k], L[j]]; save(); render(); break; }
    case "fl-start": audioSetup(); wakeLock(); flowGoto(S.active.i, "prep"); break;
    case "fl-pause": { const A = S.active; if (A.paused) { A.end = Date.now() + A.paused; A.paused = 0; } else { A.paused = Math.max(0, A.end - Date.now()); } save(); render(); break; }
    case "fl-next": { const A = S.active; flowMark(A); if (A.i + 1 < A.blocks.length) flowGoto(A.i + 1, "prep"); else finishFlow(true); break; }
    case "fl-prev": flowGoto(Math.max(0, S.active.i - 1), "prep"); break;
    case "fl-end": openSheet(() => confirmSheet("Einheit beenden?", "Alles bis hierher wird gespeichert.", "fl-end2", "Beenden & speichern")); break;
    case "fl-end2": closeSheet(); finishFlow(false); break;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target; const k = t.dataset.in; if (!k) return;
  if (k === "name") { S.name = t.value.trim(); save(); }
  if (k === "cex" && U.cex) { U.cex[t.dataset.f] = t.value; if (t.dataset.f === "base") renderSheet(); }
  if (k === "exnote") { S.notes = S.notes || {}; const v = t.value.slice(0, 300); if (v.trim()) S.notes[t.dataset.x] = v; else delete S.notes[t.dataset.x]; save(); }
  if (k === "byear" || k === "bheight" || k === "bweight") {
    const v = num(t.value); S.body = S.body || {};
    if (k === "byear") S.body.year = v >= 1920 && v <= new Date().getFullYear() - 10 ? Math.round(v) : null;
    if (k === "bheight") S.body.height = v >= 100 && v <= 230 ? Math.round(v) : null;
    if (k === "bweight" && v >= 30 && v <= 250) {
      S.measures = S.measures || []; const today = dayKey(new Date()); const e = S.measures.find((q) => dayKey(new Date(q.d)) === today);
      if (e) e.gewicht = Math.round(v * 10) / 10; else S.measures.push({ d: new Date().toISOString(), gewicht: Math.round(v * 10) / 10 });
    }
    save(); const bi = document.getElementById("bodyinfo"); if (bi) bi.innerHTML = bodyStatsHtml();
  }
  if (k === "music") { const v = t.value.trim(); S.music = /^https?:\/\//.test(v) ? v : ""; save(); }
  if (k === "caltime") { S.calTime = t.value || "18:00"; save(); }
  if (k === "ocolor") { S.outfitCustom = Object.assign(customOutfit(), { [t.dataset.k]: t.value }); delete S.outfitCustom.id; delete S.outfitCustom.n; save(); applyOutfit(); }
  if (k === "dayname") { S.days[+t.dataset.i].name = t.value; save(); }
  if (k === "clo" || k === "chi") { const c = S.days[+t.dataset.i].custom[+t.dataset.j]; const v = parseInt(t.value, 10); if (v > 0) { c.reps[k === "clo" ? 0 : 1] = v; if (c.reps[0] > c.reps[1]) c.reps = [c.reps[1], c.reps[0]]; save(); } }
  if (k === "sw" || k === "sr") { const it = itemById(curStep().id); const j = it.log.findIndex((q) => !q.done); const s0 = it.log[j]; if (!s0) return; const v = t.value.replace(/[^\d.,]/g, ""); if (k === "sw") { s0.w = v; if (!s0.warm) it.log.slice(j + 1).forEach((q) => { if (!q.done && !q.warm) q.w = v; }); } else s0.r = v; save(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && U.sheet && !U.sheetLock) closeSheet(); });

setInterval(() => {
  trainTick(); flowTick();
  const el = document.getElementById("elapsed"); if (el && S.active) el.textContent = Math.floor((Date.now() - S.active.start) / 60000) + " Min";
}, 250);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.active) wakeLock(); });

/* Start: gespeicherte Daten prüfen, erst jetzt sind alle Tabellen definiert. Wird etwas repariert, bleibt die
   Originalfassung unter „satzwerk.v1.vorReparatur“ liegen und ein Hinweis erscheint – nichts verschwindet still. */
(function bootFix() {
  const notes = [];
  try { normalizeState(S, notes); } catch (e) { console.error(e); notes.push("Die Prüfung der Daten ist fehlgeschlagen"); }
  registerCustom(); normalizeDays(notes);
  U.view = S.setup ? (S.active ? (S.active.flow ? "flow" : "train") : "home") : "ob";
  if (notes.length) { try { const raw = localStorage.getItem(KEY); if (raw && !localStorage.getItem(KEY + ".vorReparatur")) localStorage.setItem(KEY + ".vorReparatur", raw); } catch (e) {} save(); U.repair = notes; }
})();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyOutfit); new MutationObserver(() => { applyOutfit(); if (U.view === "prof" || U.view === "ob") render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}
applyTheme();
render();
(() => {
  let tag = null; try { tag = new URLSearchParams(location.search).get("tag"); } catch (e) {}
  if (tag && /^[A-Za-z0-9_-]+$/.test(tag)) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    if (S.setup) setTimeout(() => openSheet(() => importSheet(tag)), 300); else S.pendingTag = tag;
  } else if (S.setup && !S.ack && !S.active) setTimeout(() => { U.sheetLock = true; openSheet(ackSheet); }, 400);
  else if (S.setup && S.newsSeen !== NEWS.v && !S.active) setTimeout(() => openSheet(newsSheet), 400);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
})();
/* Kein Zoomen mit zwei Fingern oder Doppeltipp (wie eine native App). */
/* Zoomen ist standardmäßig aus (versehentliches Zoomen im Studio); für bessere Lesbarkeit lässt es sich im Profil erlauben. */
["gesturestart", "gesturechange", "gestureend"].forEach((ev) => document.addEventListener(ev, (e) => { if (!S.zoom) e.preventDefault(); }, { passive: false }));
document.addEventListener("touchmove", (e) => { if (!S.zoom && e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
function applyZoom() {
  let m = document.querySelector('meta[name="viewport"]'); if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
  m.content = S.zoom ? "width=device-width,initial-scale=1,viewport-fit=cover" : "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover";
}
applyZoom();
let lastTouch = 0;
document.addEventListener("touchend", (e) => { const n = Date.now(); if (n - lastTouch < 300 && !e.target.closest("input, textarea, select")) e.preventDefault(); lastTouch = n; }, { passive: false });
</script>

<script>
/* Updates: Neue Version wartet, die App zeigt „Neue Version ist da – Jetzt laden“. Ein Tipp aktiviert sie und lädt neu.
   Ohne Tipp startet die neue Version beim nächsten vollständigen Öffnen. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      const offer = (w) => { if (w && navigator.serviceWorker.controller && window.scUpdateReady) window.scUpdateReady(() => w.postMessage({ type: "skip" })); };
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
